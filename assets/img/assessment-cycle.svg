<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="cyc-title cyc-desc" font-family="Barlow, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="cyc-title">The assessment cycle at Berea</title>
  <desc id="cyc-desc">Years 1, 2, and 3 each assess about two outcomes, so every outcome is assessed at least once in the cycle. Academic departments then complete a fourth-year departmental review before a new cycle begins. Each year follows six steps: look back, plan, collect and analyze, act, document and submit by May 31, and receive feedback.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#004175"/></marker>
  </defs>
  <rect width="960" height="470" fill="#FFFFFF"/>

  <text x="24" y="38" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="600" font-size="24" fill="#004175">The three-year cycle</text>
  <g font-size="15">
    <rect x="24" y="56" width="190" height="96" fill="#004175"/>
    <text x="119" y="90" text-anchor="middle" fill="#FFFFFF" font-weight="600" font-size="20">Year 1</text>
    <text x="119" y="116" text-anchor="middle" fill="#FFFFFF">Assess about</text>
    <text x="119" y="136" text-anchor="middle" fill="#FFFFFF">two outcomes</text>

    <rect x="254" y="56" width="190" height="96" fill="#004175"/>
    <text x="349" y="90" text-anchor="middle" fill="#FFFFFF" font-weight="600" font-size="20">Year 2</text>
    <text x="349" y="116" text-anchor="middle" fill="#FFFFFF">Assess about</text>
    <text x="349" y="136" text-anchor="middle" fill="#FFFFFF">two more</text>

    <rect x="484" y="56" width="190" height="96" fill="#004175"/>
    <text x="579" y="90" text-anchor="middle" fill="#FFFFFF" font-weight="600" font-size="20">Year 3</text>
    <text x="579" y="116" text-anchor="middle" fill="#FFFFFF">Every outcome</text>
    <text x="579" y="136" text-anchor="middle" fill="#FFFFFF">assessed at least once</text>

    <rect x="714" y="56" width="222" height="96" fill="#D2DE26"/>
    <text x="825" y="90" text-anchor="middle" fill="#000000" font-weight="600" font-size="20">Year 4</text>
    <text x="825" y="116" text-anchor="middle" fill="#000000">Departmental review</text>
    <text x="825" y="136" text-anchor="middle" fill="#000000">(academic departments)</text>
  </g>
  <g stroke="#004175" stroke-width="3" fill="none">
    <path d="M216 104H250" marker-end="url(#arw)"/>
    <path d="M446 104H480" marker-end="url(#arw)"/>
    <path d="M676 104H710" marker-end="url(#arw)"/>
    <path d="M825 154V178H119V158" marker-end="url(#arw)"/>
  </g>
  <text x="472" y="198" text-anchor="middle" font-size="14" fill="#000000">Then a new cycle begins</text>

  <text x="24" y="250" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="600" font-size="24" fill="#004175">Each year</text>
  <g font-size="15">
    <g>
      <rect x="24" y="268" width="138" height="118" fill="#FFFFFF" stroke="#004175" stroke-width="2"/>
      <text x="93" y="296" text-anchor="middle" font-weight="600" fill="#004175">1. Look back</text>
      <text x="93" y="322" text-anchor="middle" fill="#000000">Past results</text>
      <text x="93" y="342" text-anchor="middle" fill="#000000">and actions</text>
      <text x="93" y="372" text-anchor="middle" font-size="13" fill="#000000">Part A</text>
    </g>
    <g>
      <rect x="180" y="268" width="138" height="118" fill="#FFFFFF" stroke="#004175" stroke-width="2"/>
      <text x="249" y="296" text-anchor="middle" font-weight="600" fill="#004175">2. Plan</text>
      <text x="249" y="322" text-anchor="middle" fill="#000000">Measures</text>
      <text x="249" y="342" text-anchor="middle" fill="#000000">and target</text>
      <text x="249" y="372" text-anchor="middle" font-size="13" fill="#000000">Part B</text>
    </g>
    <g>
      <rect x="336" y="268" width="138" height="118" fill="#FFFFFF" stroke="#004175" stroke-width="2"/>
      <text x="405" y="296" text-anchor="middle" font-weight="600" fill="#004175">3. Collect</text>
      <text x="405" y="322" text-anchor="middle" fill="#000000">and analyze</text>
      <text x="405" y="342" text-anchor="middle" fill="#000000">evidence</text>
      <text x="405" y="372" text-anchor="middle" font-size="13" fill="#000000">Part C</text>
    </g>
    <g>
      <rect x="492" y="268" width="138" height="118" fill="#FFFFFF" stroke="#004175" stroke-width="2"/>
      <text x="561" y="296" text-anchor="middle" font-weight="600" fill="#004175">4. Act</text>
      <text x="561" y="322" text-anchor="middle" fill="#000000">Plan changes</text>
      <text x="561" y="342" text-anchor="middle" fill="#000000">and reassessment</text>
      <text x="561" y="372" text-anchor="middle" font-size="13" fill="#000000">Part D</text>
    </g>
    <g>
      <rect x="648" y="268" width="138" height="118" fill="#004175"/>
      <text x="717" y="296" text-anchor="middle" font-weight="600" fill="#FFFFFF">5. Submit</text>
      <text x="717" y="322" text-anchor="middle" fill="#FFFFFF">Report and</text>
      <text x="717" y="342" text-anchor="middle" fill="#FFFFFF">materials</text>
      <text x="717" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Part E · May 31</text>
    </g>
    <g>
      <rect x="804" y="268" width="132" height="118" fill="#49B4EF"/>
      <text x="870" y="296" text-anchor="middle" font-weight="600" fill="#000000">6. Feedback</text>
      <text x="870" y="322" text-anchor="middle" fill="#000000">Rubric review</text>
      <text x="870" y="342" text-anchor="middle" fill="#000000">and comments</text>
    </g>
  </g>
  <g stroke="#004175" stroke-width="2.5" fill="none">
    <path d="M870 388V420H93V392" marker-end="url(#arw)"/>
  </g>
  <text x="482" y="444" text-anchor="middle" font-size="14" fill="#000000">Feedback informs next year's look back</text>
</svg>
